name: Tiller
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    macOS: "14.0"
targets:
  Tiller:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.tiller
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tiller
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
