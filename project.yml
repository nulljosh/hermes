name: Hermes
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
targets:
  Hermes:
    type: application
    platform: macOS
    sources:
      - Sources
      - Shared
      - Hermes.icon
      - path: fonts
        buildPhase: resources
        excludes: ["*.woff2"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hermes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Hermes
        MARKETING_VERSION: 10.3.0
        CURRENT_PROJECT_VERSION: 2
    scheme:
      testTargets: [HermesTests]
  HermesPhone:
    type: application
    platform: iOS
    info:
      path: iOS/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
    sources:
      - iOS
      - Shared
      - Hermes.icon
      - path: fonts
        buildPhase: resources
        excludes: ["*.woff2"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hermes
        PRODUCT_NAME: Hermes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Hermes
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 10.3.0
        CURRENT_PROJECT_VERSION: 2
  HermesTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Hermes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
