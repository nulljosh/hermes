name: Hermes
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    macOS: "14.0"
targets:
  Hermes:
    type: application
    platform: macOS
    sources:
      - Sources
      - Hermes.icon
      - path: fonts
        buildPhase: resources
        excludes: ["*.woff2"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hermes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Hermes
        MARKETING_VERSION: 2.2.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets: [HermesTests]
  HermesTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Hermes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
