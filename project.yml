name: Talaria
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    macOS: "14.0"
targets:
  Talaria:
    type: application
    platform: macOS
    sources:
      - Sources
      - Talaria.icon
      - path: fonts
        buildPhase: resources
        excludes: ["*.woff2"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.talaria
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Talaria
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Talaria
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 1
